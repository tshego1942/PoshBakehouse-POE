<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Request a custom cake quote from PoshBakehouse">
    <title>PoshBakehouse / Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="PoshBakehouse Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="products.html">Product</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Request a Quote</h1>
        <p>Planning an event? Let us bake for you!</p>
        <form id="enquiryForm">
        <label>Name:</label>
        <input type="text" name="email" required>

        <label>Event Type:</label>
        <select name="event">
            <option>Wedding</option>
            <option>Birthday</option>
            <option>Corporate</option>
        </select>

        <label>Message:</label>
        <textarea name="message" required></textarea>

        <button type="submit">Send Enquiry</button>
        </form>
    </main>

    <footer>
        <p> 2026 PoshBakehouse. All rights reserved. / hello@poshbakehouse.co.za</p>
    </footer>
</body>
</html>
